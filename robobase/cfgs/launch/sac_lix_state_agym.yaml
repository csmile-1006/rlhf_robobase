# @package _global_

defaults:
  - ../env: null  # Please specify environment to use in command line
  - ../method: sac_lix

pixels: false
frame_stack: 1
action_repeat: 1
num_train_envs: 4
num_eval_episodes: 5
log_every: 200
eval_every_steps: 50000
save_snapshot: true
snapshot_every_n: 50000
num_train_frames: 2001000

replay:
  size: 2000000
  nstep: 3
  num_workers: 4

hydra:
  run:
    dir: ./agym_exp/state_sac_lix/agym_${env.task_name}/default_seed${seed}_${now:%Y%m%d%H%M%S}
