# @package _global_

defaults:
  - ../env: null  # Please specify environment to use in command line
  - ../method: cqn_as_simple

pixels: false
frame_stack: 1
action_repeat: 1
action_sequence: 4
temporal_ensemble: true

batch_size: 128
update_every_steps: 1
replay:
  size: 7000000
  nstep: 3  # Use 1 for walker_walk
num_train_frames: 7001000
save_snapshot: true
eval_every_steps: 2000
snapshot_every_n: 50000
num_explore_steps: 2000
replay_size_before_train: 2000

method:
  critic_lr: 5e-5
  view_fusion_lr: 5e-5
  encoder_lr: 5e-5
  use_dueling: false
  stddev_schedule: 0.01
  advantage_model:
    keys_to_bottleneck: []
  value_model:
    keys_to_bottleneck: []
  critic_target_interval: 1000
  critic_target_tau: 1.0
  gru_layers: 0

hydra:
  run:
    dir: ./exp_local_debug/state_cqn_as_simple/humanoidbench_${env.task_name}/default_seed${seed}_${now:%Y%m%d%H%M%S}
