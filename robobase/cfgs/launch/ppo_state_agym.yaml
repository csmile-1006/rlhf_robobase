# @package _global_

defaults:
  - ../env: null  # Please specify environment to use in command line
  - ../method: ppo

pixels: false
frame_stack: 1
action_repeat: 1
num_train_envs: 32
num_eval_episodes: 2
log_every: 10
eval_every_steps: 50000
save_snapshot: true
snapshot_every_n: 50000
num_train_frames: 10001000

hydra:
  run:
    dir: ./debug/state_ppo/dmc_${env.task_name}/default_seed${seed}_${now:%Y%m%d%H%M%S}
